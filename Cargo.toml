[workspace]
members = ["crates/*"]
resolver = "2"
[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
uuid = { version = "1", features = ["v4", "serde"] }
toml = "0.8"
clap = { version = "4", features = ["derive"] }
buddy-proto = { path = "crates/buddy-proto" }
buddy-ai = { path = "crates/buddy-ai" }
buddy-agent = { path = "crates/buddy-agent" }
buddy-anchor = { path = "crates/buddy-anchor" }
